<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-center selection:bg-mode-professional-container selection:text-mode-professional">
<!-- Main Canvas Container -->
<main class="flex-1 flex flex-col items-center justify-center px-4 py-8 sm:py-12 w-full">
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Header Anchor -->
<header class="flex flex-col items-center mb-8">
<div class="w-12 h-12 bg-primary-container rounded-xl flex items-center justify-center shadow-sm select-none">
<span class="text-white text-headline-lg font-headline-lg font-semibold leading-none">ب</span>
</div>
<h1 class="mt-3 font-headline-sm text-headline-sm font-semibold text-brand-hover">بيان</h1>
</header>
<!-- Authentication Card -->
<section class="w-full bg-surface border border-border-subtle rounded-2xl p-6 sm:p-9 shadow-sm">
<!-- Header Text (Start Aligned) -->
<div class="text-start">
<h2 class="font-headline-lg text-headline-lg font-semibold text-brand-hover">إنشاء حساب</h2>
<p class="font-body-sm text-body-sm text-on-surface-muted mt-2 mb-6">ابدأ باستخدام بيان في دقائق.</p>
</div>
<!-- Registration Form -->
<form class="space-y-5" id="signup-form" onsubmit="event.preventDefault();">
<!-- Field 1: Full Name -->
<div>
<label class="font-label-md text-label-md font-medium text-brand-hover mb-1.5 block" for="full-name">الاسم الكامل</label>
<input class="w-full h-12 rounded-lg border border-border-control bg-surface px-4 font-body-md text-body-md text-brand-hover placeholder:text-outline focus:ring-2 focus:ring-focus-ring focus:border-transparent outline-none transition-all duration-150" id="full-name" name="name" placeholder="مثال: أحمد محمد" required="" type="text"/>
</div>
<!-- Field 2: Email Address -->
<div>
<label class="font-label-md text-label-md font-medium text-brand-hover mb-1.5 block" for="email">البريد الإلكتروني</label>
<input class="w-full h-12 rounded-lg border border-border-control bg-surface px-4 text-start font-body-md text-body-md text-brand-hover placeholder:text-outline focus:ring-2 focus:ring-focus-ring focus:border-transparent outline-none transition-all duration-150" dir="ltr" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Field 3: Password -->
<div>
<label class="font-label-md text-label-md font-medium text-brand-hover mb-1.5 block" for="password">كلمة المرور</label>
<div class="relative flex items-center">
<input class="w-full h-12 rounded-lg border border-border-control bg-surface ps-12 pe-4 text-start font-body-md text-body-md text-brand-hover placeholder:text-outline focus:ring-2 focus:ring-focus-ring focus:border-transparent outline-none transition-all duration-150" dir="ltr" id="password" minlength="8" name="password" required="" type="password"/>
<button aria-label="إظهار أو إخفاء كلمة المرور" class="absolute end-0 top-0 bottom-0 px-3.5 flex items-center justify-center text-outline hover:text-brand-hover focus:outline-none focus:text-mode-professional transition-colors duration-150" id="toggle-password" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password-icon">visibility</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-on-surface-muted mt-1.5">8 أحرف على الأقل</p>
</div>
<!-- Primary Submit Action -->
<div class="pt-1">
<button class="w-full h-12 bg-primary-container hover:bg-brand-hover text-on-brand font-label-md text-label-md font-medium rounded-lg shadow-sm transition-colors duration-200 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-focus-ring focus:ring-offset-2" type="submit">
              إنشاء حساب
            </button>
</div>
</form>
<!-- Redirect to Login Link -->
<div class="text-center mt-6">
<p class="font-body-sm text-body-sm text-on-surface-muted">
            لديك حساب بالفعل؟
            <a class="font-semibold text-brand-hover hover:underline inline-block ms-1 transition-colors duration-150" href="#">تسجيل الدخول</a>
</p>
</div>
</section>
</div>
</main>
<!-- Vanilla JS Micro-Interactions -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordIcon = document.getElementById('password-icon');

      if (togglePasswordBtn && passwordInput && passwordIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          if (isPassword) {
            passwordInput.setAttribute('type', 'text');
            passwordIcon.textContent = 'visibility_off';
          } else {
            passwordInput.setAttribute('type', 'password');
            passwordIcon.textContent = 'visibility';
          }
        });
      }
    });
  </script>
