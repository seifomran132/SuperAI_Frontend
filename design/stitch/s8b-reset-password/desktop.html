<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تعيين كلمة مرور جديدة - بيان</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', 'system-ui', 'sans-serif'],
          },
          colors: {
            canvas: '#F8FAFC',
            surface: '#FFFFFF',
            navy: '#1E293B',
            'navy-hover': '#0F172A',
            'on-surface': '#0F172A',
            'on-surface-muted': '#475569',
            'border-subtle': '#E2E8F0',
            'border-control': '#8B95A7',
            'focus-ring': '#4F46E5',
            'placeholder-color': '#64748B',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    ::placeholder {
      color: #64748B !important;
      opacity: 1;
    }
  </style>
</head>
<body class="h-full bg-canvas text-on-surface flex items-center justify-center p-6 selection:bg-[#EEF2FF] selection:text-[#4F46E5]">

  <!-- Centered container max 440px -->
  <main class="w-full max-w-[440px] flex flex-col items-center">

    <!-- Brand block -->
    <header class="flex flex-col items-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-navy flex items-center justify-center text-white text-2xl font-bold select-none shadow-sm" aria-hidden="true">
        ب
      </div>
      <span class="mt-3 text-lg font-semibold text-on-surface">
        بيان
      </span>
    </header>

    <!-- White Card -->
    <section class="w-full bg-surface border border-border-subtle rounded-2xl p-6 sm:p-[36px] shadow-[0_4px_6px_-1px_rgba(15,23,42,0.03)]">
      
      <!-- Heading block (start-aligned) -->
      <div class="text-start mb-8">
        <h1 class="text-[24px] font-semibold text-on-surface leading-[36px]">
          تعيين كلمة مرور جديدة
        </h1>
        <p class="text-[16px] text-on-surface-muted mt-2 leading-[26px]">
          اختر كلمة مرور جديدة لحسابك.
        </p>
      </div>

      <!-- Form -->
      <form class="space-y-6" onsubmit="event.preventDefault();">
        
        <!-- Field 1: New Password -->
        <div class="space-y-2 text-start">
          <label for="new-password" class="block text-[14px] font-medium text-on-surface">
            كلمة المرور الجديدة
          </label>
          <div class="relative">
            <input 
              id="new-password" 
              name="new-password" 
              type="password" 
              dir="ltr" 
              placeholder="••••••••" 
              class="w-full h-12 pe-4 ps-12 bg-surface border border-border-control rounded-lg text-start text-on-surface placeholder:text-placeholder-color text-[15px] focus:outline-none focus:ring-2 focus:ring-focus-ring focus:border-transparent transition-all duration-150"
            />
            <button 
              type="button" 
              class="absolute inset-y-0 end-0 flex items-center justify-center w-11 text-on-surface-muted hover:text-on-surface transition-colors focus:outline-none"
              aria-label="إظهار كلمة المرور"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
          <p class="text-[14px] text-on-surface-muted leading-relaxed">
            8 أحرف على الأقل
          </p>
        </div>

        <!-- Field 2: Confirm Password -->
        <div class="space-y-2 text-start">
          <label for="confirm-password" class="block text-[14px] font-medium text-on-surface">
            تأكيد كلمة المرور
          </label>
          <div class="relative">
            <input 
              id="confirm-password" 
              name="confirm-password" 
              type="password" 
              dir="ltr" 
              placeholder="••••••••" 
              class="w-full h-12 pe-4 ps-12 bg-surface border border-border-control rounded-lg text-start text-on-surface placeholder:text-placeholder-color text-[15px] focus:outline-none focus:ring-2 focus:ring-focus-ring focus:border-transparent transition-all duration-150"
            />
            <button 
              type="button" 
              class="absolute inset-y-0 end-0 flex items-center justify-center w-11 text-on-surface-muted hover:text-on-surface transition-colors focus:outline-none"
              aria-label="إظهار كلمة المرور"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            class="w-full h-12 bg-navy hover:bg-navy-hover text-white text-[16px] font-medium rounded-lg transition-colors duration-150 flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-focus-ring cursor-pointer"
          >
            حفظ كلمة المرور
          </button>
        </div>

      </form>
    </section>

  </main>

</body>
</html>
